name: SEO OS CI

on:
  push:
    branches: [seo-os-v1, "seo-os-v1/**", main]
    paths: ["seoos/**", "web/**", ".github/workflows/seoos-ci.yml"]
  pull_request:
    paths: ["seoos/**", "web/**", ".github/workflows/seoos-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seoos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seoos_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: seoos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seoos_test -d seoos_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: seoos
    env:
      SEOOS_TEST_DATABASE_URL: postgres://seoos_test:test-only-password@127.0.0.1:5432/seoos_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: seoos/go.mod
          cache-dependency-path: seoos/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify formatting and modules
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod download
          go mod verify
      - name: Verify isolated dependencies
        run: |
          python3 - <<'PY'
          import subprocess
          deps = subprocess.check_output(["go", "list", "-mod=readonly", "-deps", "./cmd/seoos"], text=True).splitlines()
          blocked = [d for d in deps if (d.startswith("github.com/Autumn-27/artex/") and not d.startswith("github.com/Autumn-27/artex/seoos/")) or d == "github.com/Autumn-27/artex" or d.startswith("github.com/Autumn-27/norma")]
          assert not blocked, f"Legacy runtime dependency found: {blocked}"
          print(f"Verified {len(deps)} isolated dependencies")
          PY
      - name: Install PDF test runtime
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Unit and PostgreSQL integration tests with race detector
        env:
          SEOOS_REQUIRE_POPPLER: "1"
        run: go test -race -count=1 ./...
      - name: Vet and build
        run: |
          go vet ./...
          go build -trimpath -o bin/seoos ./cmd/seoos
          go build -trimpath -tags seoos_testfixture -o bin/seoos-fixture ./cmd/seoos
      - name: HTTP and PostgreSQL smoke test
        run: python3 scripts/smoke_test.py
      - name: API and worker process separation with PostgreSQL
        run: python3 scripts/smoke_runtime_modes.py
      - name: Google, Bing, and IndexNow HTTP contracts with PostgreSQL
        run: python3 scripts/smoke_execution.py
      - name: Local 160-site load test
        run: python3 scripts/load_test.py
      - name: Real disposable WordPress publication and rollback
        run: bash scripts/test_wordpress.sh
      - name: Build and check dashboard
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build:static
          npm run build
          npx tsc --noEmit
          npx playwright install --with-deps chromium
      - name: Browser acceptance test
        env:
          SEOOS_E2E_RESEARCH: "1"
          SEOOS_E2E_CONTENT: "1"
          SEOOS_E2E_EXECUTION: "1"
        run: python3 scripts/test_dashboard.py
      - name: Build isolated container
        run: docker build --tag artex-seoos:ci .
      - name: Build standalone web container
        working-directory: web
        run: docker build --tag artex-seoos-web:ci .
      - name: Exercise PDF and Chromium extraction inside the sandbox runtime
        run: bash scripts/test_extraction.sh
