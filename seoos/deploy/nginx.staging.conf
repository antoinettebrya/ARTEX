log_format artex_seoos '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=artex_seoos_web:5m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name @STAGING_HOST@;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/artex-seoos-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 308 https://@STAGING_HOST@$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @STAGING_HOST@;

    ssl_certificate /etc/letsencrypt/live/@STAGING_HOST@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@STAGING_HOST@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "ARTEX staging";
    auth_basic_user_file /etc/artex-seoos/nginx.htpasswd;
    client_max_body_size 7m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control private always;
    access_log /var/log/nginx/artex-seoos.access.log artex_seoos;
    error_log /var/log/nginx/artex-seoos.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/artex-seoos-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        limit_req zone=artex_seoos_web burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:@WEB_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
    }
}
